# Project-wide Gradle settings.
# Lowered from 8g — machine has 7.5GB total RAM, 8g is unreachable and crashes R8
org.gradle.jvmargs=-Xmx3500m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
